<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #0d1322;
    }
  </style>
  <title>CADFly viewer</title>
</head>

<!-- data-app: where "Open in cadfly" goes (the build changes it to the folder, where the app is index.html) -->
<body data-app="cadfly.html">
  <div id="viewer"></div>
  <script src="./viewer.bundle.js"></script>
</body>

</html>
